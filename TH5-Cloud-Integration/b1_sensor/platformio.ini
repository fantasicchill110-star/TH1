[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8, bblanchon/ArduinoJson@^7.4.3

[env:esp32dev]
build_flags = -DWOKWI_SIMULATION

[env:hardware]
build_flags = -DHARDWARE_WIFI
